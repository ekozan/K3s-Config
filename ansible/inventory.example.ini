# Copier en inventory.ini et adapter. Les secrets devraient passer par
# ansible-vault plutôt qu'en clair ici.
[k3s_nodes]
kube2 ansible_host=10.10.0.131 crowdsec_machine_password=CHANGE_ME crowdsec_bouncer_key=CHANGE_ME
kube1 ansible_host=10.10.0.130 crowdsec_machine_password=CHANGE_ME crowdsec_bouncer_key=CHANGE_ME

[k3s_nodes:vars]
ansible_user=max
ansible_python_interpreter=/usr/bin/python3


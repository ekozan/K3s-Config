---
# Rattache l'hôte à la LAPI CrowdSec du cluster (cf. ubuntu-hardening.md Annexe A).
# Nécessite crowdsec_machine_password et crowdsec_bouncer_key (par hôte, inventaire).
- name: Vérifier la présence des identifiants CrowdSec
  ansible.builtin.assert:
    that:
      - crowdsec_machine_password is defined and crowdsec_machine_password | length > 0
      - crowdsec_bouncer_key is defined and crowdsec_bouncer_key | length > 0
    fail_msg: >-
      crowdsec_machine_password / crowdsec_bouncer_key manquants. Les extraire du
      Secret crowdsec-host-credentials (cf. ansible/README.md) et les placer dans
      l'inventaire (idéalement via ansible-vault).

- name: Ajouter le dépôt CrowdSec
  ansible.builtin.shell:
    cmd: curl -s https://install.crowdsec.net | sh
    creates: /etc/apt/sources.list.d/crowdsec_crowdsec.list

- name: Installer agent + firewall-bouncer (nftables)
  ansible.builtin.apt:
    name:
      - crowdsec
      - crowdsec-firewall-bouncer-nftables
    state: present
    update_cache: true

- name: Pointer l'agent vers la LAPI du cluster (désactive la LAPI locale)
  ansible.builtin.copy:
    dest: /etc/crowdsec/config.yaml.local
    owner: root
    group: root
    mode: "0600"
    content: |
      # Géré par Ansible. Surcharge : pas de LAPI locale, on utilise celle du cluster.
      api:
        server:
          enable: false
  notify: restart crowdsec

- name: Identifiants machine (agent → LAPI distante)
  ansible.builtin.template:
    src: local_api_credentials.yaml.j2
    dest: /etc/crowdsec/local_api_credentials.yaml
    owner: root
    group: root
    mode: "0600"
  notify: restart crowdsec

- name: Acquisition des logs SSH de l'hôte
  ansible.builtin.template:
    src: acquis.yaml.j2
    dest: /etc/crowdsec/acquis.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart crowdsec

- name: Installer les collections SSH/Linux
  ansible.builtin.command: "cscli collections install {{ item }}"
  args:
    creates: "/etc/crowdsec/collections/{{ item | basename }}.yaml"
  loop: "{{ crowdsec_collections }}"
  notify: restart crowdsec

- name: Configurer le firewall-bouncer (table nftables dédiée)
  ansible.builtin.template:
    src: crowdsec-firewall-bouncer.yaml.j2
    dest: /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml
    owner: root
    group: root
    mode: "0600"
  notify: restart crowdsec-firewall-bouncer

- name: Activer agent + firewall-bouncer
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - crowdsec
    - crowdsec-firewall-bouncer

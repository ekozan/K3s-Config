---
# Corrige le K3S_KUBECONFIG_MODE="644" (kubeconfig admin lisible par tous).
- name: Vérifier la présence du kubeconfig k3s
  ansible.builtin.stat:
    path: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig

- name: Restreindre le kubeconfig admin à root (0600)
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    owner: root
    group: root
    mode: "0600"
  when: k3s_kubeconfig.stat.exists
